# Sikkerhetsheadere, delt snippet. Inkluderes i hver location fordi nginx
# dropper arvede add_header-direktiver i enhver location som selv setter
# add_header (her: Cache-Control). 'always' sender headeren ogsaa paa
# redirect- og feilsvar.
#
# CSP er bevisst utelatt: en for streng policy kan bryte dashbordet
# (vendor-JS, data-JSON, fonter). Legg den til etter testing om oenskelig.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
