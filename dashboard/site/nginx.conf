# www og fly.dev omdirigeres permanent til apex-domenet, slik at
# soekemotorer ser ett kanonisk nettsted.
server {
    listen 8080;
    server_name www.kiindeksen.no kiindeksen.fly.dev;
    include /etc/nginx/security-headers.conf;
    return 301 https://kiindeksen.no$request_uri;
}

server {
    listen 8080 default_server;
    server_name kiindeksen.no;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/csv text/markdown application/xml;
    gzip_min_length 1024;

    # Sikkerhetsheadere. NB: nginx dropper arvede add_header i enhver location
    # som selv setter add_header, saa snippeten inkluderes ogsaa i hver
    # location under.
    include /etc/nginx/security-headers.conf;

    # HTML alltid ferskt; CSS/JS lastes med versjonsparameter fra HTML-en
    # og kan derfor caches.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }
    # Engelsk utgave (/en/): HTML alltid ferskt, som den norske forsiden.
    location = /en/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /en/index.html =404;
    }
    location = /en/index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /en/about.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /vendor/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
    }
    # dashboard.json maa vaere i takt med app.js: alltid revalider.
    location = /data/dashboard.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /data/occupations.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location /data/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=600";
        try_files $uri $uri/ =404;
    }
}
