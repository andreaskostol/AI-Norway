# Fly.io-konfigurasjon for MCP-koblingen til KI-indeksen (kiindeksen-mcp.fly.dev)
app = "kiindeksen-mcp"
primary_region = "arn"

[build]

[env]
  KIINDEKSEN_BASE = "https://kiindeksen.no"
  KIINDEKSEN_REFRESH_HOURS = "6"
  KIINDEKSEN_FEEDBACK_DIR = "/data/feedback"

# Tilbakemeldinger (feedback.jsonl) ligger paa dette volumet, saa de overlever utrullinger.
# Ikke fjern [mounts]: da forsvinner meldingene ved neste omstart.
[mounts]
  source = "feedback_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
